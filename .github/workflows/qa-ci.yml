name: Validação de QA

"on":
  pull_request:
  push:
  merge_group:

permissions:
  contents: read

jobs:
  local-tests:
    name: Testes locais e Gherkin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Executar testes unitários
        shell: bash
        run: |
          mkdir -p reports
          python -m unittest discover -s tests -v 2>&1 | tee reports/unit-tests.log

      - name: Validar cenários e definições Gherkin
        shell: bash
        run: |
          mkdir -p reports
          python -m behave --dry-run --format plain 2>&1 | tee reports/gherkin.log


      - name: Publicar evidências locais
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-qa-local
          path: reports/
          retention-days: 14
